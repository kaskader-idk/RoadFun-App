name: RoadFun build & smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api-and-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate frontend JavaScript
        run: |
          node --check src/RoadFun.Api/wwwroot/app.js
          node --check src/RoadFun.Api/wwwroot/navigation.js
          node --check src/RoadFun.Api/wwwroot/sw.js
          python3 -m py_compile scripts/mock-routing.py
      - name: Restore and build
        run: dotnet build src/RoadFun.Api/RoadFun.Api.csproj -c Release
      - name: API smoke test
        run: bash scripts/smoke-test.sh
